<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Service Triage PoC</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
</head>
<body>
    <main>
        <h1>AI Service Triage PoC</h1>
        <p>System Status: Running.</p>
        <p><a href="{{ url_for('tickets') }}">View submitted tickets</a></p>
        <h2>Submit an IT service request</h2>
        {% if error %}
        <p class="error" role="alert">{{ error }}</p>
        {% endif %}
        <form action="{{ url_for('submit_ticket') }}" method="post">
            <label for="title">Ticket title</label>
            <input type="text" id="title" name="title" value="{{ title | default('') }}" required>

            <label for="description">Ticket description</label>
            <textarea id="description" name="description" rows="6" required>{{ description | default('') }}</textarea>

            <button type="submit">Submit request</button>
        </form>
    </main>
</body>
</html>
